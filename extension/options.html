<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://127.0.0.1:*; style-src 'self'; script-src 'self'" />
    <title>Vault — налаштування розширення</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="options">
    <main class="card">
      <div class="head">
        <span class="logo">V</span>
        <span class="title">Під’єднання до Vault</span>
      </div>
      <p class="hint">
        Відкрийте Vault → Налаштування → «Розширення для Chrome» і скопіюйте ключ і порт. Дані надходять лише у Vault на цьому комп’ютері (127.0.0.1).
      </p>
      <div class="row">
        <label class="label" for="port">Порт</label>
        <input id="port" inputmode="numeric" placeholder="47219" />
      </div>
      <div class="row">
        <label class="label" for="key">Ключ</label>
        <input id="key" type="password" autocomplete="off" spellcheck="false" />
      </div>
      <div class="error" id="error" role="alert"></div>
      <div class="actions">
        <span class="status" id="status" data-state="pending"><span class="dot"></span><span id="status-text">Не перевірено</span></span>
        <button type="button" class="ghost" id="check">Перевірити під’єднання</button>
        <button type="button" class="primary" id="save">Зберегти</button>
      </div>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
