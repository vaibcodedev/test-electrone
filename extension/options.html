<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://127.0.0.1:*; style-src 'self'; script-src 'self'" />
    <title>Vault — налаштування розширення</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="options">
    <main class="card">
      <div class="head">
        <span class="logo">V</span>
        <span class="title">Підключення до Vault</span>
      </div>
      <p class="hint">
        Відкрийте Vault → Налаштування → «Розширення для Chrome» і скопіюйте ключ і порт. Дані надходять лише у Vault на цьому комп’ютері (127.0.0.1).
      </p>
      <form id="form" class="card-form" novalidate>
        <div class="row">
          <label class="label" for="port">Порт</label>
          <input id="port" inputmode="numeric" placeholder="47219" aria-describedby="port-error" />
          <div class="field-error" id="port-error"></div>
        </div>
        <div class="row">
          <label class="label" for="key">Ключ</label>
          <div class="input-row">
            <input id="key" type="password" autocomplete="off" spellcheck="false" aria-describedby="key-error" />
            <button type="button" class="soft" id="reveal" aria-label="Показати ключ" aria-controls="key">Показати</button>
          </div>
          <div class="field-error" id="key-error"></div>
        </div>
        <div class="status-row">
          <div class="status" id="status" role="status" data-state="pending"><span class="dot"></span><span id="status-text">Не перевірено</span></div>
        </div>
        <div class="actions">
          <button type="submit" class="primary" id="save">Зберегти й перевірити</button>
        </div>
      </form>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
